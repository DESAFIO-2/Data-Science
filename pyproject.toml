[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sus-cidadao-ds"
version = "0.2.0"
description = "Frente de Ciência de Dados do SUS Cidadão (NavegaSUS) — EDA, Golden Dataset, RAG Híbrido, Calibração, RAGAS, ChromaDB, Airflow DAGs e Orquestrador Multiagentes LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Marlon Dias Marques", email = "143219967+oficialmarlonmd@users.noreply.github.com" },
    { name = "Esquadrão SUS Cidadão (Desafio 2 - Instituto Eldorado / UnB / Softex)" },
]
dependencies = [
    "pydantic>=2.7.0",
    "polars>=1.0.0",
    "scikit-learn>=1.5.0",
    "pyyaml>=6.0.1",
    "chromadb>=0.5.0",
    "pypdf>=5.0.0",
    "reportlab>=4.0.0",
    "langgraph>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
]
ragas = [
    "ragas>=0.1.10",
    "datasets>=2.20.0",
]
airflow = [
    "apache-airflow>=2.9.0",
]
agents = [
    "langgraph>=0.2.0",
]
api = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-multipart>=0.0.9",
    "httpx>=0.27.0",
]
voice = [
    "edge-tts>=6.1.0",
]

[project.scripts]
sus-cidadao-ds = "sus_cidadao_ds.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = [
    "reportlab.*",
    "chromadb.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

