name: Data-Science CI (SDD + RAG + MLflow)

on:
  push:
    branches: ["main", "develop", "feat/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          python-version: "3.12"

      - name: Sync dependencies
        run: uv sync --extra dev

      - name: Lint with Ruff
        run: uv run ruff check src tests

      - name: Type-check with Mypy
        run: uv run mypy src tests

      - name: Run Unit & Integration Tests (SDD Specs 00–05)
        run: uv run pytest -v

      - name: Run Full Reproducible Pipeline (Sync -> EDA -> Calibrate -> Benchmark)
        run: |
          PYTHONPATH=src uv run python -m sus_cidadao_ds.cli sync
          PYTHONPATH=src uv run python -m sus_cidadao_ds.cli eda
          PYTHONPATH=src uv run python -m sus_cidadao_ds.cli calibrate
          PYTHONPATH=src uv run python -m sus_cidadao_ds.cli eval

