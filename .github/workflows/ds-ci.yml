name: Data-Science CI (SDD + RAG + Airflow)

on:
  push:
    branches: ["main", "develop", "feat/**"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  quality-and-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml

      - name: Install dependencies
        run: |
          uv pip install --system -e ".[dev]"

      - name: Lint with Ruff
        run: |
          ruff check src tests dags

      - name: Type-check with Mypy
        run: |
          mypy src tests

      - name: Run Unit & Integration Tests (SDD Specs 00–08)
        run: |
          pytest -v

      - name: Run Full Reproducible Pipeline (Sync -> EDA -> Calibrate -> Pipeline PDF -> Benchmark)
        run: |
          PYTHONPATH=src python -m sus_cidadao_ds.cli sync
          PYTHONPATH=src python -m sus_cidadao_ds.cli eda
          PYTHONPATH=src python -m sus_cidadao_ds.cli calibrate
          PYTHONPATH=src python -m sus_cidadao_ds.cli pipeline-pdf
          PYTHONPATH=src python -m sus_cidadao_ds.cli eval
